[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ipm-lstm-attn"
version = "0.1.0"
description = "Self-attention extension of the IPM-LSTM learned interior-point solver"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Krishna Annavaram" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pydantic>=2.5",
]

[project.optional-dependencies]
torch = ["torch>=2.1"]
ipopt = ["cyipopt>=1.3"]
plot = ["matplotlib>=3.7"]
all = ["ipm-lstm-attn[torch,ipopt,plot]"]
dev = ["pytest>=8"]

[project.scripts]
ipm-lstm-attn = "ipm_lstm_attn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
