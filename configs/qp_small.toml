# Small convex QP study that runs on a laptop CPU in minutes.
name = "qp_small"

[data]
family = "qp"
n_var = 20
n_eq = 10
n_ineq = 10
n_instances = 500
seed = 17
val_frac = 0.1
test_frac = 0.1
split_seed = 0

[ipm]
sigma = 0.1
tau = 0.995
outer_iters = 15
precondition = true
reference_tol = 1e-8
reference_max_iter = 200
warm_tol = 1e-6

[model]
variant = "lstm2_mask"
hidden_dim = 32
d_model = 16
heads = 4
dropout = 0.0
inner_steps = 10

[train]
seed = 0
epochs = 20
batch_size = 32
lr = 1e-3
weight_decay = 0.0
patience = 5
grad_clip = 1.0

[ablation]
variants = ["lstm1", "lstm2", "lstm2_attn", "lstm2_mask", "lstm2_gnn"]
seeds = [0, 1, 2, 3, 4]
baseline = "lstm1"
bootstrap = 2000

[bench]
warmup = 2
repeats = 5
batch_size = 32
max_instances = 20
